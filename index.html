<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>TenantOwners | Premium Property Rentals & Real Estate</title>
    <meta name="description" content="Discover premium rental properties, manage your listings, and directly connect with landlords or tenants on TenantOwners. The modern way to rent." />
    <link rel="canonical" href="https://tenantowners.in/" />
    <!-- SEO & Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <!-- Preconnects for Core Web Vitals (Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TenantOwners | Premium Property Rentals" />
    <meta property="og:description" content="Discover premium rental properties, manage your listings, and directly connect with landlords or tenants on TenantOwners. The modern way to rent." />
    <meta property="og:url" content="https://tenantowners.in/" />
    <meta property="og:site_name" content="TenantOwners" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1200&q=80" />
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TenantOwners | Premium Property Rentals" />
    <meta name="twitter:description" content="Discover premium rental properties, manage your listings, and directly connect with landlords or tenants on TenantOwners. The modern way to rent." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1200&q=80" />
    <meta name="theme-color" content="#4aa4f0" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <!-- Security: Basic Content Security Policy to help mitigate XSS (adjust as necessary) -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TenantOwners",
        "alternateName": "TenanTOwners",
        "url": "https://tenantowners.in/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
  </body>
</html>
